#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

kotlin.mpp.enableCInteropCommonization.nowarn=true

# Coverage ratchet — constitution principle VIII.
# Minimum line coverage, in whole percent, across all modules (root Kover total variant).
# Started at the coverage measured when CI was switched on (0 / 4843 lines on 2026-10-08) and
# raised by spec 004 to 529 / 5740 lines = 9.22 % and by spec 005 to 1094 / 7191 = 15.21 %,
# rounded down. Raise it in any PR that adds tests; lowering it requires a constitution amendment.
granatum.coverage.minLine=15
